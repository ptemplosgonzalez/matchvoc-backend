ktor:
  deployment:
    port: ${PORT:-8080}
  application:
    modules:
      - com.SerializationKt.configureSerialization
      - com.ExposedKt.configureExposed
      - com.ResourcesKt.configureResources
      - com.RoutingKt.configureRouting
      - com.HTTPKt.configureHTTP

storage:
  driverClassName: "com.mysql.cj.jdbc.Driver"
  jdbcURL: "jdbc:mysql://${MYSQLHOST:-localhost}:${MYSQLPORT:-3306}/${MYSQL_DATABASE:-matchvoc}"
  user: "${MYSQLUSER:-root}"
  password: "${MYSQL_ROOT_PASSWORD:-root}"